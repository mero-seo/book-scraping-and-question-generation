services:
  mongo:
    image: mongo:7
    container_name: book-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: book-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: book-backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=book_db
      - OLLAMA_URL=http://ollama:11434
      - PORT=8080
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: book-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  mongo_data:
  ollama_data:
